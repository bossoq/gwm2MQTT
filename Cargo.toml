[package]
name = "gwm2mqtt"
version = "0.3.0"
edition = "2021"

[lib]
name = "gwm2mqtt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
jsonwebtoken = "9.3.1"
log = "0.4.26"
log4rs = "1.3.0"
md5 = "0.7.0"
rand = "0.9.0"
regex = "1.11.1"
reqwest = { version = "0.12.12", features = ["json", "rustls-tls"] }
rumqttc = "0.24.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
tokio = { version = "1.43.0", features = ["full"] }
url = "2.5.4"
urlencoding = "2.1.3"
uuid = { version = "1.15.1", features = ["v4"] }
axum = { version = "0.8", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package.metadata.deb]
name = "gwm2mqtt"
maintainer = "bossoq"
copyright = "2024 bossoq"
extended-description = """\
Polls the GWM Cloud API and publishes vehicle telemetry to an MQTT broker \
for Home Assistant auto-discovery. Includes a web dashboard for live status \
and remote commands.\
"""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/gwm2mqtt", "usr/bin/gwm2mqtt", "755"],
    ["debian/gwm2mqtt.service", "usr/lib/systemd/system/gwm2mqtt.service", "644"],
]
maintainer-scripts = "debian"
